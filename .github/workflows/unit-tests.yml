name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant for entity tests
        run: python -m pip install homeassistant==2025.3.4
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
