name: Bug report
description: Report a reproducible problem with the integration
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened and what did you expect to happen?
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: For example 1.3.1
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      description: For example 2026.4.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the related Home Assistant logs here. Remove tokens and other secrets before posting.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Device type, `deviceId`, `devSubTypeId`, or any packet captures that help reproduce the issue
